<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>
  <header class="header">
    <a href="#" class="logo">
      <img src="" data-src="гиля2.png" alt="Gilya" class="logo-img">
    </a>
    <nav class="nav">
      <a href="#artworks" class="nav-link">Artworks</a>
      <a href="#contact" class="nav-link">Contact</a>
    </nav>
  </header>

  <main>
    <section id="artworks" class="artworks">
      <h2 class="section-title">Artworks</h2>
      <div class="artworks-list">
        <article class="artwork-row">
          <div class="artwork-image-wrap">
            <img data-src="pink.png" alt="Pink">
          </div>
          <div class="artwork-text">
            <p class="artwork-title">"I hate pink"</p>
            <p>Oil on Canvas<br>100 x 100 cm</p>
          </div>
        </article>
        <article class="artwork-row artwork-row--reverse artwork-row--small">
          <div class="artwork-image-wrap">
            <img data-src="sound%20sleep.jpg" alt="Sound Sleep">
          </div>
          <div class="artwork-text">
            <p class="artwork-title">"Sound sleep"</p>
            <p>Oil on Canvas<br>60 x 80 cm</p>
          </div>
        </article>
        <article class="artwork-row">
          <div class="artwork-image-wrap">
            <img data-src="IMG_1294.png" alt="A girl in a forest of red birch trees">
          </div>
          <div class="artwork-text">
            <p class="artwork-title">"A girl in a forest of red birch trees"</p>
            <p>Oil on Canvas<br>80 x 100 cm</p>
          </div>
        </article>
      </div>
    </section>

    <section id="contact" class="contact">
      <h2 class="section-title">Contact</h2>
      <div class="contact-content">
        <p><a href="mailto:Mironvlasov2@gmail.com" class="contact-email">Mironvlasov2@gmail.com</a></p>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>&copy; 2025</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
